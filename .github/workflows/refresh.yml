name: Daily forecast refresh

on:
  schedule:
    - cron: "30 1 * * *"  # 06:30 Lahore time, after the CAMS morning update
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Fetch fresh data and forecast
        run: uv run python -m aqforecast.refresh
      - name: Commit updated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/latest_forecast.parquet artifacts/latest_obs.parquet \
                  artifacts/forecast_log.parquet artifacts/live_accuracy.json artifacts/daily_pm25.parquet
          git diff --staged --quiet || git commit -m "chore: daily forecast refresh"
          git push
