[project]
name = "aqforecast"
version = "0.1.0"
description = "Lahore PM2.5 forecasting and smog-alert system"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "pyarrow>=15",
    "duckdb>=1.0",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "shap>=0.45",
    "mlflow>=2.12",
    "streamlit>=1.35",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "jupyter>=1.0", "nbconvert>=7", "ipykernel>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqforecast"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "app"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # formatting-only; long f-strings in the app are intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
